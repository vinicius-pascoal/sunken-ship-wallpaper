<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunken Ship Wallpaper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Efeito de ondulação -->
  <div id="water-distortion"></div>
  
  <!-- Raios de luz -->
  <div id="light-rays">
    <div class="light-ray" style="left: 15%; animation-delay: 0s;"></div>
    <div class="light-ray" style="left: 35%; animation-delay: 2s;"></div>
    <div class="light-ray" style="left: 55%; animation-delay: 4s;"></div>
    <div class="light-ray" style="left: 75%; animation-delay: 1s;"></div>
    <div class="light-ray" style="left: 90%; animation-delay: 3s;"></div>
  </div>
  
  <!-- Camadas de fundo -->
  <div class="background-layer" id="layer1"></div>
  
  <!-- Partículas flutuantes -->
  <div id="particles-container"></div>
  
  <!-- Tubarão -->
  <img src="./public/personagens/tubarao.png" id="shark" alt="Tubarão">
  
  <!-- Submarino Amarelo -->
  <img src="./public/personagens/yellow-submarine.png" id="submarine" alt="Submarino Amarelo">
  
  <div class="background-layer" id="layer2"></div>
  
  <!-- Baú do Tesouro -->
  <div id="treasure-chest-container">
    <img src="./public/imgs/assets/bau.png" id="treasure-chest" alt="Baú do Tesouro">
    <div id="treasure-glow"></div>
  </div>
  
  <div class="background-layer" id="layer3"></div>

  <!-- Container para bolhas -->
  <div id="bubbles-container"></div>

  <!-- Relógio -->
  <div id="clock-container">
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
